# docker compose 版前端容器配置（静态文件挂载 /usr/share/nginx/html）
# 与 nginx.conf.example 的区别：后端地址用 compose 服务名 server:8080
#
# ⚠️ 挂载路径必须是 ./web/dist:/usr/share/nginx/html/app:ro —— web 的 vite base
#    固定为 /app/，产物里的 /app/assets/*、/app/sw.js 是绝对路径，挂到 html 根会全部 404。
#    见 docker-compose.yml 文末的 web 服务示例。
#
# TLS 证书：将证书挂载进容器（如 /etc/nginx/ssl/），并修改下方路径。
# 生成自签名证书（仅本地测试）：
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout /etc/nginx/ssl/modernchat.key \
#     -out /etc/nginx/ssl/modernchat.crt -days 365

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ===== TLS 配置 =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_certificate /etc/nginx/ssl/modernchat.crt;
    ssl_certificate_key /etc/nginx/ssl/modernchat.key;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 压缩 =====
    # 预压缩文件由 npm run build 生成（.gz / .br），直接发送、零 CPU；
    # 缺失时回落 gzip 实时压缩。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;
    gzip_static on;
    # brotli 需 nginx 编译 ngx_brotli 模块（官方镜像没有），确认后再启用：
    # brotli on;
    # brotli_static on;

    # ===== 安全响应头（API 响应头由后端中间件负责）=====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # 强制后续访问走 HTTPS：后端只有看到 X-Forwarded-Proto=https 才会给
    # 会话 cookie 加 Secure，先靠 HSTS 把浏览器拽回 HTTPS 才能避免 cookie 明文外泄。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP 默认不启用：插件沙箱靠 iframe srcdoc + 内联脚本，严格 CSP 会让插件系统失效。
    # 启用前请先把插件改为外链沙箱页，并保留 'unsafe-inline'。

    # 根路径重定向到聊天室（compose 形态只部署聊天、无官网）
    location = / {
        return 302 /app/;
    }

    # 聊天前端：web/dist 挂载在 html/app/ 下
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # location 内一旦声明 add_header 就不再继承 server 级头部，需重复
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 带指纹的静态资源长缓存（命中 /app/assets/*）
    location ~* ^/app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx add_header 不跨层级继承：此 location 定义了 add_header 后，
        # server 级安全头不再自动继承，必须在此重复声明
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Service Worker 必须禁用缓存，否则升级后旧 SW 继续生效
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS 在 nginx 终止、回源是明文；不传这个头后端会以为请求是 HTTP，
        # 登录 cookie 就不会带 Secure，可被同域 http:// 请求带出。
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # 媒体上传（multipart）：应用侧 200 MB 天花板 + 余量
    location /api/upload {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 210m;
        proxy_request_buffering off;
    }

    # 本地存储的上传文件在容器内 DATA_DIR 之下的 uploads/，不在 nginx 的 html 根，
    # 且 /uploads 需要登录 cookie；交给静态服务会 404，必须回源。
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        # token 只能走 query（浏览器 WS 不能自定义头），默认日志会记录完整 URI
        # 从而留下可用令牌 —— 关闭该路径的访问日志（CWE-598）。
        access_log off;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
